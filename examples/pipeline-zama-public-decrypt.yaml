# Example pipeline: Sepolia logs -> UnwrapFinalized handles -> zama_public_decrypt -> print
#
# Checks the relayer path with no key: every UnwrapFinalized log carries both the
# public handle and its on-chain cleartext, so `matches` must be true on every row.
#
# Requires:
#   - STREAMLING__PLUGIN__PATH = a directory holding this repo's plugin library and
#     the library providing `ethereum_source` (both are loaded).
#   - The Zama SDK daemon (@zama-fhe/sdk-daemon, same zama-ai/sdk commit as the
#     `zama-sdk` dependency) listening on `daemon_socket`; its directory must be 0700.
#   - The public Sepolia RPC keeps ~45k blocks of logs; move the block range forward
#     to recent UnwrapFinalized logs once this one is pruned.
name: zama-public-decrypt-sepolia
sources:
  blocks:
    type: ethereum_source
    rpc_url: https://ethereum-sepolia-rpc.publicnode.com
    start_block: "11910290"
    end_block: "11910400"

transforms:
  unwraps:
    type: sql
    primary_key: id
    sql: |
      WITH r AS (
        SELECT unnest(array_enumerate(receipts)) AS receipt, block_hash, block_number, _gs_op
        FROM blocks
      ),
      l AS (
        SELECT unnest(array_enumerate(receipt.value.logs)) AS log, receipt, block_hash, block_number, _gs_op
        FROM r
      ),
      u AS (
        SELECT
          CONCAT(block_hash, '_', CAST(receipt.index AS VARCHAR), '_', CAST(log.index AS VARCHAR)) AS id,
          block_number,
          log.value.transaction_hash AS transaction_hash,
          log.value.log_index AS log_index,
          lower(log.value.data) AS d,
          _gs_op
        FROM l
        WHERE lower(log.value.address) = '0x7c5bf43b851c1dff1a4fee8db225b87f2c223639'
          AND lower(log.value.topics[1]) = '0x87061fd1a5b3714805472c94c9eb8a6b8491992ee77791aa2594be67b92fd962'
      )
      SELECT
        id, block_number, transaction_hash, log_index,
        substr(d, 1, 66) AS handle,
        -- uint64 = last 16 hex digits of data word 2, as two 32-bit halves
        CAST(CAST(((strpos('0123456789abcdef', substr(d, 115, 1)) - 1) * 268435456 + (strpos('0123456789abcdef', substr(d, 116, 1)) - 1) * 16777216 + (strpos('0123456789abcdef', substr(d, 117, 1)) - 1) * 1048576 + (strpos('0123456789abcdef', substr(d, 118, 1)) - 1) * 65536 + (strpos('0123456789abcdef', substr(d, 119, 1)) - 1) * 4096 + (strpos('0123456789abcdef', substr(d, 120, 1)) - 1) * 256 + (strpos('0123456789abcdef', substr(d, 121, 1)) - 1) * 16 + (strpos('0123456789abcdef', substr(d, 122, 1)) - 1) * 1) AS DECIMAL(20,0)) * 4294967296 + ((strpos('0123456789abcdef', substr(d, 123, 1)) - 1) * 268435456 + (strpos('0123456789abcdef', substr(d, 124, 1)) - 1) * 16777216 + (strpos('0123456789abcdef', substr(d, 125, 1)) - 1) * 1048576 + (strpos('0123456789abcdef', substr(d, 126, 1)) - 1) * 65536 + (strpos('0123456789abcdef', substr(d, 127, 1)) - 1) * 4096 + (strpos('0123456789abcdef', substr(d, 128, 1)) - 1) * 256 + (strpos('0123456789abcdef', substr(d, 129, 1)) - 1) * 16 + (strpos('0123456789abcdef', substr(d, 130, 1)) - 1) * 1) AS VARCHAR) AS expected_amount,
        _gs_op
      FROM u

  decrypted:
    type: zama_public_decrypt
    from: unwraps
    chain_id: "11155111"
    rpc_url: https://ethereum-sepolia-rpc.publicnode.com
    daemon_socket: /tmp/zama-sdk/zama.sock  # or STREAMLING__PLUGIN__ZAMA_PUBLIC_DECRYPT__DAEMON_SOCKET
    handle_column: handle

  checked:
    type: sql
    primary_key: id
    sql: |
      SELECT *, (zama_public_amount = expected_amount) AS matches FROM decrypted

sinks:
  out:
    type: print
    from: checked
