# Example pipeline: ConfidentialTransfer logs -> zama_decrypt -> print
#
# Decrypts ERC-7984 transfer amounts for wallets that delegated decryption on-chain
# (ACL.delegateForUserDecryption) to the address of the delegate key. The fixture
# holds 2 Sepolia cUSDCMock transfers (block 11915267); without a delegation from
# either party every row prints zama_error = "no active delegation from either party".
# To decrypt real amounts, replace the fixture with logs of a delegating wallet.
#
# Run from the repository root with the same plugin library and daemon as
# pipeline-zama-public-decrypt.yaml, plus the delegate key in the environment,
# never in this file (Streamling logs YAML options at INFO):
#   STREAMLING__PLUGIN__ZAMA_DECRYPT__DELEGATE_PRIVATE_KEY=0x...
name: zama-delegated-decrypt-sepolia
sources:
  logs:
    type: file
    path: examples/fixtures/sepolia-confidential-transfers.csv
    format: csv
    mode:
      type: bounded
    primary_key: id

transforms:
  decrypted:
    type: zama_decrypt
    from: logs
    chain_id: "11155111"
    rpc_url: https://ethereum-sepolia-rpc.publicnode.com
    daemon_socket: /tmp/zama-sdk/zama.sock  # or STREAMLING__PLUGIN__ZAMA_DECRYPT__DAEMON_SOCKET

sinks:
  out:
    type: print
    from: decrypted
